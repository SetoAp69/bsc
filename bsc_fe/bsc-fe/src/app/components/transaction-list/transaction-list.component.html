@if (transactionList) {
    <div
        class="table-responsive"
    >
        <table
            class="table table-striped table-hover table-borderless table-primary align-middle"
        >
            <thead class="table-light">
                <caption>
                    Gig Transactions
                </caption>
                <tr>
                    <th>No.</th>
                    <th>Gig Name</th>
                    <th>Status</th>
                    <th>Total Price</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                @for (transaction of transactionList; track $index) {
                    <tr
                        class="table-primary"
                    >
                        <td scope="row">{{ $index + 1 }}</td>
                        <td>{{ transaction.gigName }}</td>
                        <td>{{ transaction.transactionStatus | titlecase }}</td>
                        <td>{{ transaction.totalPrice }}</td>
                        <td>{{ transaction.date }}</td>
                    </tr>
                }
            </tbody>
            <tfoot>
                
            </tfoot>
        </table>
    </div>
}
