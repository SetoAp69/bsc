<div class="position-relative d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 w-25 mt-3" style="min-width: 350px;">
        <div class="card-body p-4">
            <h4 class="text-center accordionfw-bold mb-1">Create New Gig</h4>
            <hr class="border-dark border-2">
            <form [formGroup]="createGigForm" (submit)="OnSubmit()">
                <div class="mb-3">
                    <label for="name" class="form-label">Gig's Name</label>
                    <input id="" type="text" class="form-control" placeholder="Enter Gig's name" formControlName="name">
                </div>
                <div class="mb-lg-3">
                    <label for="price" class="form-label">Price</label>
                    <input type="number" min="1" class="form-control" placeholder="Enter Gig's price"
                        formControlName="price">
                </div>
                <div class="mb-lg-3">
                    <label for="duration" class="form-label">Duration</label>
                    <input type="number" min="1" class="form-control" placeholder="How long does it take?"
                        formControlName="duration">
                </div>
                <div class="mb-lg-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea rows="2" class="form-control" placeholder="Tell us about your gig"
                        formControlName="description"></textarea>
                </div>
                <div class="mb-lg-3">
                    <label for="types" class="form-label">Types</label>
                    <app-gig-type-selector formControlName="types" [options]="types"></app-gig-type-selector>
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-4">
                    Create Gig
                </button>
            </form>
        </div>
    </div>
</div>
