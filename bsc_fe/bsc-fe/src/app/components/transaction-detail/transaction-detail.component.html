<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light p-3">
  <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
    
    <!-- Receipt Header -->
    <div class="card-body p-4">
      <div class="text-center">
        <h4 class="fw-bold mb-1">Transaction Detail</h4>
        <div class="text-muted small">Edit Item</div>
      </div>

      <hr class="border-dark border-2 border-dashed">

      <form (submit)="onSubmit()" [formGroup]="transactionForm">
        <div class="mb-3">
          <label class="form-label fw-bold">Item Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter item name"
            formControlName="itemName"
          >
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Item Path</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter item path"
            formControlName="itemPath"
          >
        </div>

        <div class="mt-3">
          <label class="form-label fw-bold">Item Description</label>
          <textarea
            class="form-control"
            rows="2"
            placeholder="Description"
            formControlName="itemDescription"
          ></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Status</label>
          <select class="form-select" formControlName="status">
            @for (status of transactionStatusOptions; track $index) {
              <option [value]="status">{{ status }}</option>
            }
          </select>
        </div>

        <hr class="border-dark border-2 border-dashed">

        <button type="submit" class="btn btn-dark w-100 mt-4">
          Edit Item
        </button>
      </form>
    </div>
  </div>
</div>

<div class="min-vh-100 d-flex align-items-center justify-content-end bg-light p-3">
  <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
    
    <!-- Receipt Header -->
    <div class="card-body p-4">
      <div class="text-center">
        <h4 class="fw-bold mb-1">Buyer's Note</h4>
    </div>
    <div class="mt-3">
    <p
            class="form-control"
            rows="2"
            placeholder="Description"
    >
        {{transactionDetail?.buyerDescription}}
    </p>
    </div>

      <hr class="border-dark border-2 border-dashed">
    </div>
  </div>
</div>
