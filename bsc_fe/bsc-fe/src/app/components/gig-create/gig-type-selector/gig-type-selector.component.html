<div class=" w-100">
    <div class="w-100 form-control d-flex flex-wrap align-items-center gap-1 overflow-y-auto cursor-pointer"
        style="max-height: 64px;" data-bs-auto-close="outside" data-bs-toggle="dropdown" aria-expanded="false">
        @for (id of selectedIds; track id) {
        <span class="badge bg-primary d-inline-flex align-items-center gap-1 py-1 px-2 fs-7 fw-normal">
            {{ getTypeName(id) }}
        </span>
        } @empty {
        <span class="text-muted fs-6">Select types...</span>
        }
    </div>

    <div class="dropdown-menu w-100 shadow-sm p-2" style="max-height: 250px; overflow-y: auto;">
        @for (option of options; track option.id) {
        <div class="dropdown-item w-100 d-flex align-items-center justify-content-between rounded py-2 px-3 mb-1"
            [class.active]="isSelected(option.id)" (click)="toggleType(option)">
            <span>{{ option.name }}</span>
            @if (isSelected(option.id)) {
            <i class="bi bi-check-lg fw-bold ms-2"></i>
            }
        </div>
        } @empty {
        <div class="text-muted text-center py-2 fs-7">No options available</div>
        }
    </div>
</div>
